<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Background on Type</title>
    <style>
        /* Base page styling */
        body {
            transition: background-color 0.3s ease; /* Makes color transition smooth */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* Input box styling */
        input {
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 4px;
            outline: none;
        }
    </style>
</head>
<body>

  Hello World!
</body>
</html>
